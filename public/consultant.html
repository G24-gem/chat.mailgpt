<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailGPT | AI Consultant Guide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            background: #0f172a;
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .consultant-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(20px);
        }

        .header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-area {
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 1rem;
        }

        .btn-action {
            padding: 0.8rem 1.5rem;
            background: var(--accent-gradient);
            border: none;
            border-radius: 99px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            padding: 0.8rem 1.5rem;
            color: white;
            outline: none;
        }

        .msg {
            max-width: 80%;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent-gradient);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .nav-back {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-right: auto;
        }

        .nav-back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="consultant-container">
        <header class="header">
            <img src="/favicon.svg" width="32" height="32" alt="Logo">
            <h1 style="font-size: 1.2rem; font-family: 'Syne';">MailGPT AI Consultant</h1>
            <a href="/" class="nav-back">← Back to App</a>
        </header>

        <div class="chat-area" id="chatLines">
            <div class="msg bot">👋 Hello! I am your MailGPT Consultant. I have read the entire system document and can
                guide you through using our autonomous Gmail poller, follow-up engine, and AI interview process.
                <br><br><b>What can I help you master today?</b></div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about the poller, follow-ups, or how to get started..."
                autocomplete="off">
            <button class="btn-action" id="sendBtn">Ask Consultant</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chatLines');
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');

        async function ask() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            // Append User message
            const uMsg = document.createElement('div');
            uMsg.className = 'msg user';
            uMsg.textContent = text;
            chat.appendChild(uMsg);
            chat.scrollTop = chat.scrollHeight;

            // Thinking...
            const tMsg = document.createElement('div');
            tMsg.className = 'msg bot';
            tMsg.textContent = 'Analyzing documentation...';
            chat.appendChild(tMsg);

            try {
                const res = await fetch('/api/consultant/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                tMsg.innerHTML = data.reply.replace(/\n/g, '<br>');
            } catch (e) {
                tMsg.textContent = 'I temporarily disconnected from our knowledge base. Please try again.';
            }
            chat.scrollTop = chat.scrollHeight;
        }

        btn.onclick = ask;
        input.onkeydown = e => { if (e.key === 'Enter') ask(); };
    </script>
</body>

</html>
